name: Index

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # sent by the auto-merge job, as a merge it makes starts no push run on main
  repository_dispatch:
    types: [auto-merged]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a run on main mid-release, or the release is created but never deployed
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# read-only unless a job grants itself more, as website and lighthouse do
permissions:
  contents: read

jobs:
  # checks, release-please and the GitHub Pages deploy, which runs when a release is published
  website:
    uses: apollogeddon/forgejs/.github/workflows/website.yml@main
    with:
      build_env_vars: "PUBLIC_WEB3FORMS_ACCESS_KEY=${{ vars.PUBLIC_WEB3FORMS_ACCESS_KEY }}"
      # the auto-merge job below merges once Lighthouse has passed too
      auto_merge: false
    permissions:
      contents: write
      packages: read
      pages: write
      id-token: write
      pull-requests: write

  # forgejs's website workflow runs only the standard scripts, so Lighthouse gets a job of its own
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: npm run build
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.PUBLIC_WEB3FORMS_ACCESS_KEY }}
      - name: Lighthouse
        run: npm run lhci
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore

  # last, so a Dependabot pull request merges only once the website checks and Lighthouse pass
  auto-merge:
    needs: [website, lighthouse]
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' }}
    uses: apollogeddon/forgejs/.github/workflows/merge.yml@main
    permissions:
      contents: write
      pull-requests: write

  # after a release's deploy, from a push to main or the dispatch an auto-merge sends
  validate:
    needs: website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.website.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate live site
        run: curl -f --retry 5 --retry-delay 10 --retry-connrefused https://ht.apollogeddon.com
